[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "Автоматический конвейер вертикальных роликов: статья -> сценарий -> озвучка -> видео с субтитрами"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "trafilatura>=2",
    "piper-tts>=1.8",
    "faster-whisper>=1.1",
    "edge-tts>=7",
    "anthropic>=1.5",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shorts = "shorts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
